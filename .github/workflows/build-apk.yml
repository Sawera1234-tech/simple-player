
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.example --project-name simple_player .
          flutter pub get
          dart tools/setup.dart

      - name: Fix Java and Kotlin targets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path("android"),
              Path.home() / ".pub-cache" / "hosted" / "pub.dev",
          ]

          changed = []

          for root in roots:
              if not root.exists():
                  continue

              for file in root.rglob("*"):
                  if not file.is_file():
                      continue

                  if file.name not in ("build.gradle", "build.gradle.kts"):
                      continue

                  try:
                      original = file.read_text()
                  except (OSError, UnicodeError):
                      continue

                  updated = original.replace(
                      "JavaVersion.VERSION_11",
                      "JavaVersion.VERSION_17"
                  )

                  updated = re.sub(
                      r"""(jvmTarget\s*=\s*['"])11(['"])""",
                      r"\g<1>17\g<2>",
                      updated
                  )

                  if updated != original:
                      file.write_text(updated)
                      changed.append(str(file))

          print("Updated Gradle files:", len(changed))
          for file in changed:
              print(file)
          PY

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: simple-player-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
