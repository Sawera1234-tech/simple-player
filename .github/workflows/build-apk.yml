
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.example --project-name simple_player .
          flutter pub get
          dart tools/setup.dart

      - name: Configure Kotlin JVM validation
        shell: bash
        run: |
          if [ ! -f android/gradle.properties ]; then
            touch android/gradle.properties
          fi

          if grep -q '^kotlin\.jvm\.target\.validation\.mode=' android/gradle.properties; then
            sed -i 's/^kotlin\.jvm\.target\.validation\.mode=.*/kotlin.jvm.target.validation.mode=warning/' android/gradle.properties
          else
            echo 'kotlin.jvm.target.validation.mode=warning' >> android/gradle.properties
          fi

      - name: Set Android compile SDK to 36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          gradle = next((p for p in candidates if p.exists()), None)

          if gradle is None:
              raise SystemExit("Android app Gradle file not found")

          content = gradle.read_text()

          updated, count = re.subn(
              r'(\bcompileSdk\s*(?:=\s*)?)(?:\d+|flutter\.compileSdkVersion)',
              r'\g<1>36',
              content,
              count=1
          )

          if count == 0:
              raise SystemExit(
                  "compileSdk setting not found. Gradle file: " + str(gradle)
              )

          gradle.write_text(updated)
          print("compileSdk set to 36 in", gradle)
          PY

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: simple-player-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
