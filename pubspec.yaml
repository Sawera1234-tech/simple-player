name: simple_player
description: Simple offline video and music player with a private vault.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.9.2
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  on_audio_query: ^2.9.0
  photo_manager: ^3.5.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2
  crypto: ^3.0.5
  provider: ^6.1.2
  wakelock_plus: ^1.2.8
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
