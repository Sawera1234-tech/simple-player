name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android project banao aur APK build karo
        run: bash setup.sh

      - name: APK upload karo
        uses: actions/upload-artifact@v4
        with:
          name: simple-player-apk
          path: build/app/outputs/flutter-apk/app-release.apk
